<!-- Avisa ao navegador que este arquivo é HTML moderno (HTML5) -->
<!DOCTYPE html>

<!-- <html> envolve a página inteira. lang="pt-BR" diz que o idioma é português -->
<html lang="pt-BR">

<!-- HEAD: configurações da página (não aparecem na tela) -->
<head>
    <!-- Permite usar acentos e "ç" sem dar erro -->
    <meta charset="UTF-8">

    <!-- Título que aparece na aba do navegador -->
    <title>Aula JavaScript</title>

    <!-- Liga o arquivo de estilo (cores, tamanhos, etc.) -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- BODY: tudo que aparece na tela -->
<body>
    <h1>Minha aula de JavaScript</h1>
    <p>Aperte F12 e abra a aba Console para ver o resultado do script.</p>
    <p id="mensagem"></p>

    <!-- Liga o arquivo JavaScript. Fica no final do body para
         a página carregar primeiro e o script rodar depois -->
    <script src="script.js"></script>
</body>

</html>
